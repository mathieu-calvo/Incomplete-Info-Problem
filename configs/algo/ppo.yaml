name: ppo

actor:
  hidden_sizes: [256, 256]
critic:
  hidden_sizes: [256, 256]

rollout_hands: 2_048
epochs: 4
batch_size: 512

learning_rate: 3.0e-4
gamma: 0.995
gae_lambda: 0.95
clip_ratio: 0.2
entropy_coef: 0.01
value_coef: 0.5
grad_clip: 1.0

warm_start_from: null   # path to a Deep CFR strategy checkpoint
