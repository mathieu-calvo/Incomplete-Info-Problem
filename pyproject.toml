[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "iip"
version = "0.2.0"
description = "Incomplete-Info-Problem: Deep CFR + PPO self-play for heads-up limit hold'em, with a Streamlit app for human-vs-bot play."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mathieu Calvo" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "torch>=2.2",
    "treys>=0.1.8",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pydantic>=2.7",
    "tqdm>=4.66",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.36",
    "supabase>=2.5",
    "huggingface_hub>=0.24",
]
train = [
    "wandb>=0.17",
    "huggingface_hub>=0.24",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
]

[project.scripts]
iip = "iip.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/iip"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
